# Continuous integration pipeline for ShellPilot.
#
# Mirrors the former Azure Pipelines definition (azure-pipelines.yml):
#   * Build  - calculate the version with GitVersion, build and package the
#              module, then publish the output/ folder as a build artifact.
#   * Test   - on Linux, Windows and macOS (PowerShell 7), reuse the build
#              artifact and run the Sampler test workflow.
#   * Deploy - on the upstream repository, for pushes to main or v* tags,
#              publish the release to GitHub and the PowerShell Gallery and
#              raise the changelog pull request.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   GitHubToken     - personal access token used to create the GitHub release
#                     and the changelog pull request.
#   GalleryApiToken - PowerShell Gallery API key used to publish the module.
name: CI

# Azure DevOps renames each run to the GitVersion number via
# ##vso[build.updatebuildnumber]. GitHub Actions has no equivalent: run-name is
# evaluated before any job starts and can only see the github/inputs contexts,
# so it cannot contain a version GitVersion computes mid-run. The closest we can
# get is: show the version in the run title for tag releases (the tag IS the
# version), and stamp the computed GitVersion value into the test/deploy job
# names and the build job summary on every run (see the build job's outputs).
run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || '' }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '!v*-*'
    paths-ignore:
      - CHANGELOG.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  buildArtifactName: output
  defaultBranch: main

jobs:
  build:
    name: Package Module
    runs-on: ubuntu-latest
    # Expose the GitVersion value to downstream jobs so they can show it in their
    # display names - the closest GitHub gets to Azure DevOps' run renaming.
    outputs:
      fullSemVer: ${{ steps.gitversion.outputs.FullSemVer }}
      nuGetVersion: ${{ steps.gitversion.outputs.NuGetVersionV2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # GitVersion needs the full history to calculate the version.
          fetch-depth: 0

      - name: Calculate ModuleVersion (GitVersion)
        id: gitversion
        shell: pwsh
        env:
          # GitVersion 5.x targets an older .NET; allow it to run on the
          # runner's newer shared framework.
          DOTNET_ROLL_FORWARD: LatestMajor
        run: |
          dotnet tool install --global GitVersion.Tool --version 5.*
          $env:PATH += [System.IO.Path]::PathSeparator + (Join-Path -Path $HOME -ChildPath '.dotnet/tools')
          $gitVersionObject = dotnet-gitversion | ConvertFrom-Json
          $gitVersionObject.PSObject.Properties.ForEach{
              Write-Host -Object "Setting output '$($_.Name)' with value '$($_.Value)'."
              "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          Write-Host -Object "ModuleVersion (FullSemVer): $($gitVersionObject.FullSemVer)"
          "## ShellPilot $($gitVersionObject.FullSemVer)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Build & Package Module
        shell: pwsh
        env:
          ModuleVersion: ${{ steps.gitversion.outputs.NuGetVersionV2 }}
        run: ./build.ps1 -ResolveDependency -Tasks pack

      - name: Publish Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.buildArtifactName }}
          path: output/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test ${{ needs.build.outputs.fullSemVer }} (${{ matrix.os }}, pwsh ${{ matrix.powershell }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        powershell:
          - '7.4'
          - current
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.buildArtifactName }}
          path: output/

      - name: Install minimum PowerShell
        if: matrix.powershell == '7.4'
        shell: pwsh
        run: |
          $version = '7.4.19'
          # SHA-256 digests of the official release assets; update them with
          # $version. They are pinned because an anonymous api.github.com lookup
          # shares the hosted runner's per-IP rate limit and can fail the job.
          $pinnedDigests = @{
            'PowerShell-7.4.19-win-x64.zip'        = 'cd62ad6d8174cc6fb85b335a0058444bc934fe27c39fa97fe342134286d28af9'
            'PowerShell-7.4.19-win-arm64.zip'      = 'ac3a0249c0cd9f5b55f198f681485099ea73f45838dfd676457571a94d793463'
            'powershell-7.4.19-linux-x64.tar.gz'   = '1b023e097b0e0546ad9566f7a2126cbe0eb8455fa7b0c5de558e317b8ddc16c8'
            'powershell-7.4.19-linux-arm64.tar.gz' = '2b11aafacf574222abaf691a0b3b2d463e617d17fe337343c2fb93ea871a4691'
            'powershell-7.4.19-osx-x64.tar.gz'     = 'bb67378d9b9d469d0c3863aa8a5576a38ad8eaa0fd7aae2c4819e7caf06cb79c'
            'powershell-7.4.19-osx-arm64.tar.gz'   = 'fb9d6656d0c78c6d3f6e8d08ff15e5e0d867f886bf4ebecfde6484d2fa06c042'
          }
          $architecture = $env:RUNNER_ARCH.ToLowerInvariant()
          if ($architecture -notin @('x64', 'arm64')) {
            throw "Unsupported runner architecture: $architecture"
          }
          $archiveName = switch ($env:RUNNER_OS) {
            'Windows' { "PowerShell-$version-win-$architecture.zip" }
            'Linux' { "powershell-$version-linux-$architecture.tar.gz" }
            'macOS' { "powershell-$version-osx-$architecture.tar.gz" }
            default { throw "Unsupported runner OS: $env:RUNNER_OS" }
          }
          $expectedDigest = $pinnedDigests[$archiveName]
          if ($expectedDigest -cnotmatch '^[a-f0-9]{64}$') {
            throw "No pinned SHA-256 digest for $archiveName."
          }
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          Invoke-WebRequest -Uri "https://github.com/PowerShell/PowerShell/releases/download/v$version/$archiveName" -OutFile $archivePath -ErrorAction Stop
          $actualDigest = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualDigest -cne $expectedDigest) {
            throw "Checksum mismatch for $archiveName."
          }
          $installPath = Join-Path $env:RUNNER_TEMP 'powershell-minimum'
          New-Item -Path $installPath -ItemType Directory -Force | Out-Null
          if ($env:RUNNER_OS -eq 'Windows') {
            Expand-Archive -LiteralPath $archivePath -DestinationPath $installPath -Force
          } else {
            tar -xzf $archivePath -C $installPath
            if ($LASTEXITCODE -ne 0) { throw 'PowerShell archive extraction failed.' }
            chmod +x (Join-Path $installPath 'pwsh')
            if ($LASTEXITCODE -ne 0) { throw 'PowerShell executable permissions could not be set.' }
          }
          $installPath | Out-File -LiteralPath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run Tests
        shell: pwsh
        env:
          TEST_POWERSHELL: ${{ matrix.powershell }}
        run: |
          if ($env:TEST_POWERSHELL -eq '7.4' -and
              ($PSVersionTable.PSVersion.Major -ne 7 -or $PSVersionTable.PSVersion.Minor -ne 4)) {
              throw "Expected PowerShell 7.4, got $($PSVersionTable.PSVersion)."
          }
          $PSVersionTable.PSVersion.ToString()
          if ($env:TEST_POWERSHELL -eq '7.4') {
            $runtimeExecutable = [Environment]::ProcessPath
            if ([IO.Path]::GetFileNameWithoutExtension($runtimeExecutable) -ne 'pwsh') {
              throw "Expected a native PowerShell executable, got $runtimeExecutable."
            }
            $childVersion = & $runtimeExecutable -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
            if ($LASTEXITCODE -ne 0 -or $childVersion -ne $PSVersionTable.PSVersion.ToString()) {
              throw 'The child PowerShell runtime does not match the test runtime.'
            }
            Write-Output "Validated native PowerShell parent/child version: $childVersion"
          }
          ./build.ps1 -AutoRestore -Tasks test

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CodeCoverage-${{ matrix.os }}-${{ matrix.powershell }}
          path: output/testResults/
          if-no-files-found: warn

  deploy:
    name: Deploy Module ${{ needs.build.outputs.fullSemVer }}
    needs: [build, test]
    runs-on: ubuntu-latest
    # Only deploy from the upstream repository, for pushes to the default
    # branch or for version tags.
    if: >-
      github.repository_owner == 'raandree' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.buildArtifactName }}
          path: output/

      - name: Publish Release
        shell: pwsh
        env:
          GitHubToken: ${{ secrets.GitHubToken }}
          GalleryApiToken: ${{ secrets.GalleryApiToken }}
          ModuleVersion: ${{ needs.build.outputs.nuGetVersion }}
          ReleaseBranch: ${{ env.defaultBranch }}
          MainGitBranch: ${{ env.defaultBranch }}
        run: ./build.ps1 -Tasks publish

      - name: Send Changelog PR
        shell: pwsh
        env:
          GitHubToken: ${{ secrets.GitHubToken }}
          ReleaseBranch: ${{ env.defaultBranch }}
          MainGitBranch: ${{ env.defaultBranch }}
        run: ./build.ps1 -Tasks Create_ChangeLog_GitHub_PR
